name: CI

on:
  pull_request:
    branches:
      - master
      - 'release/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Backend tests
        run: pnpm --filter @workspace/backend test

      - name: CLI tests (includes task-read prompt net-size gate)
        run: pnpm --filter chatroom-cli test
