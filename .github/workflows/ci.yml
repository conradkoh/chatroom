name: CI

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node runs so its `cache: pnpm` lookup
      # can resolve the pnpm store directory.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Typecheck changed workspaces
        run: pnpm turbo run typecheck --filter=@workspace/shared --filter=chatroom-cli --filter=@workspace/backend --filter=@workspace/webapp

  test:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shared
            dir: packages/shared
          - name: cli
            dir: packages/cli
          - name: backend
            dir: services/backend
          - name: webapp
            dir: apps/webapp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node runs so its `cache: pnpm` lookup
      # can resolve the pnpm store directory.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full Vitest suite
        run: pnpm --dir ${{ matrix.dir }} exec vitest run
