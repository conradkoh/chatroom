name: CI

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck changed workspaces
        run: pnpm turbo run typecheck --filter=chatroom-cli --filter=@workspace/backend --filter=@workspace/webapp

      - name: Test CLI (full)
        run: pnpm turbo run test --filter=chatroom-cli

      - name: Test backend stop suites
        run: >
          pnpm --dir services/backend exec vitest run
          src/domain/entities/agent-stop-command.spec.ts
          src/domain/usecase/agent/agent-stop-reaper.spec.ts
          src/domain/usecase/agent/begin-machine-stop-execution.spec.ts
          src/domain/usecase/agent/complete-machine-stop-execution.spec.ts
          src/domain/usecase/agent/create-agent-stop-command.spec.ts
          src/domain/usecase/agent/derive-agent-stop-state.spec.ts
          src/domain/usecase/agent/reconcile-unreported-stop-targets.spec.ts
          src/domain/usecase/agent/rollup-agent-stop-command.spec.ts
          src/domain/usecase/agent/supersede-inflight-agent-stop-commands.spec.ts

      - name: Test webapp stop suites
        run: >
          pnpm --dir apps/webapp exec vitest run
          src/modules/chatroom/hooks/useAgentStop.test.ts
          src/modules/chatroom/components/AgentControls.stop.test.tsx
          src/modules/chatroom/components/AgentPanel/RemoteAgentQuickActions.test.tsx
          src/modules/chatroom/components/ChatroomSidebar.test.tsx
