name: E2E Tests

on:
  pull_request:
    branches:
      - master

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The E2E job owns an ephemeral self-hosted Convex deployment. Keep the
      # browser and the Convex CLI pointed at the same local backend.
      CONVEX_SELF_HOSTED_URL: http://127.0.0.1:3210
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start self-hosted Convex backend
        run: |
          docker run --detach \
            --name convex-backend \
            --publish 3210:3210 \
            --publish 3211:3211 \
            --env CONVEX_CLOUD_ORIGIN="$CONVEX_SELF_HOSTED_URL" \
            --env CONVEX_SITE_ORIGIN=http://127.0.0.1:3211 \
            --env DISABLE_BEACON=true \
            --env DISABLE_METRICS_ENDPOINT=true \
            --env DO_NOT_REQUIRE_SSL=true \
            --env DOCUMENT_RETENTION_DELAY=1 \
            --env INDEX_RETENTION_DELAY=1 \
            --env RETENTION_DELETE_FREQUENCY=10 \
            ghcr.io/get-convex/convex-backend:latest

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$CONVEX_SELF_HOSTED_URL/version"; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs convex-backend
              exit 1
            fi
            sleep 2
          done

          admin_key="$(docker exec convex-backend ./generate_admin_key.sh)"
          if [ -z "$admin_key" ]; then
            echo 'Convex backend did not return an admin key.'
            exit 1
          fi
          echo "::add-mask::$admin_key"
          echo "CONVEX_SELF_HOSTED_ADMIN_KEY=$admin_key" >> "$GITHUB_ENV"

      - name: Deploy Convex backend
        run: |
          pnpm --filter @workspace/backend exec convex deploy --typecheck enable --yes
          pnpm --filter @workspace/backend exec convex env set E2E_SEEDING_ENABLED true

      - name: Install Playwright browsers
        run: pnpm --filter @workspace/webapp exec playwright install --with-deps

      - name: Run upstream E2E tests
        if: github.repository == 'conradkoh/next-convex-starter-app'
        run: pnpm --filter @workspace/webapp e2e:upstream

      - name: Run downstream E2E tests
        if: github.repository != 'conradkoh/next-convex-starter-app'
        run: pnpm --filter @workspace/webapp e2e:downstream

      - name: Show Convex logs on failure
        if: failure()
        run: docker logs convex-backend || true

      - name: Stop self-hosted Convex backend
        if: always()
        run: docker rm --force convex-backend || true
